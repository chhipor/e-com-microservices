spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - RemoveRequestHeader=Cookie
            # Safety net: if a downstream service ever adds CORS headers again,
            # keep only the gateway's value so browsers never see duplicates.
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            - DedupeResponseHeader=Vary, RETAIN_UNIQUE
          # Single source of truth for browser CORS. Downstream services must not add CORS headers.
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                # Comma-separated list; override with the CORS_ALLOWED_ORIGINS env var.
                allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://127.0.0.1:3001}
                allowedMethods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600
          routes:
            - id: auth-openapi
              uri: ${AUTH_SERVICE_URL:http://localhost:6666}
              predicates:
                - Path=/api/auth/v3/api-docs
              filters:
                - RewritePath=/api/auth/v3/api-docs, /v3/api-docs
            - id: operation-openapi
              uri: ${OPERATION_SERVICE_URL:http://localhost:8888}
              predicates:
                - Path=/api/operations/v3/api-docs
              filters:
                - RewritePath=/api/operations/v3/api-docs, /v3/api-docs
            - id: reporting-openapi
              uri: ${REPORTING_SERVICE_URL:http://localhost:9999}
              predicates:
                - Path=/api/reports/v3/api-docs
              filters:
                - RewritePath=/api/reports/v3/api-docs, /v3/api-docs
            - id: cron-openapi
              uri: ${CRON_SERVICE_URL:http://localhost:7777}
              predicates:
                - Path=/api/jobs/v3/api-docs
              filters:
                - RewritePath=/api/jobs/v3/api-docs, /v3/api-docs
            - id: auth-users
              uri: ${AUTH_SERVICE_URL:http://localhost:6666}
              predicates:
                - Path=/api/auth/users,/api/auth/users/**
              filters:
                - RewritePath=/api/auth/users(?<segment>/?.*), /users${segment}
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:6666}
              predicates:
                - Path=/api/auth/**
              filters:
                - RewritePath=/api/auth(?<segment>/?.*), /auth${segment}
            - id: operation-service
              uri: ${OPERATION_SERVICE_URL:http://localhost:8888}
              predicates:
                - Path=/api/operations/**
              filters:
                - StripPrefix=2
            - id: reporting-service
              uri: ${REPORTING_SERVICE_URL:http://localhost:9999}
              predicates:
                - Path=/api/reports/**
              filters:
                - RewritePath=/api/reports(?<segment>/?.*), /reports${segment}
            - id: cron-service
              uri: ${CRON_SERVICE_URL:http://localhost:7777}
              predicates:
                - Path=/api/jobs/**
              filters:
                - RewritePath=/api/jobs(?<segment>/?.*), /jobs${segment}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      # Actuator endpoints are served by the gateway itself (not via a route), so
      # spring.cloud.gateway.globalcors does not apply to them. Keep in sync with globalcors.
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://127.0.0.1:3001}
        allowed-methods: GET,OPTIONS
        allowed-headers: "*"
        allow-credentials: true
        max-age: 3600
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    URLs:
      - name: Auth Service
        url: /api/auth/v3/api-docs
      - name: Operation Service
        url: /api/operations/v3/api-docs
      - name: Reporting Service
        url: /api/reports/v3/api-docs
      - name: Cron Service
        url: /api/jobs/v3/api-docs
