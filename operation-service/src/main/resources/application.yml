spring:
  application:
    name: operation-service
  datasource:
    url: jdbc:postgresql://localhost:5433/operation_service_db
    username: operation_user
    password: operation_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

server:
  port: 8888

auth:
  jwt:
    secret: MzY0YjY0YjZlNjQ2YjQ2YjY0YjZlNjQ2YjQ2YjY0YjZlNjQ2YjQ2YjY0YjZlNjQ2YjQ2YjY0YjZlNjQ2YjQ=
    issuer: auth-service

springdoc:
  servers:
    - url: /api/operations
