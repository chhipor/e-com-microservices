services:
  postgres:
    image: postgres:16-alpine
    container_name: auth-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_service_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5555:5432"
    volumes:
      - auth_service_pgdata:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-auth-schema.sql:ro
      - ./src/main/resources/data.sql:/docker-entrypoint-initdb.d/02-auth-data.sql:ro

volumes:
  auth_service_pgdata:
