spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5555/auth_service_db
    username: auth_user
    password: auth_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 6666

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

auth:
  jwt:
    secret: MzY0YjY0YjZlNjQ2YjQ2YjY0YjZlNjQ2YjQ2YjY0YjZlNjQ2YjQ2YjY0YjZlNjQ2YjQ2YjY0YjZlNjQ2YjQ=
    access-token-expiration-minutes: 60
    refresh-token-expiration-days: 7
    issuer: auth-service
  admin:
    email: admin@local.test
    password: Admin@1234!
    first-name: System
    last-name: Administrator
