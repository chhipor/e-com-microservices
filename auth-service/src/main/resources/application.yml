spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5555/auth_service_db
    username: auth_user
    password: auth_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Keep local development resilient when the Postgres volume predates the schema.
      # schema.sql/data.sql still initialize the database and this lets Hibernate create
      # any missing mapped tables instead of failing with "relation users does not exist".
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
  # Dates are written as ISO-8601 strings: that is Jackson 3's default (Spring Boot 4),
  # so the old spring.jackson.serialization.write-dates-as-timestamps setting is not needed.

server:
  port: 6666

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

auth:
  jwt:
    secret: MzY0YjY0YjZlNjQ2YjQ2YjY0YjZlNjQ2YjQ2YjY0YjZlNjQ2YjQ2YjY0YjZlNjQ2YjQ2YjY0YjZlNjQ2YjQ=
    access-token-expiration-minutes: 60
    refresh-token-expiration-days: 7
    issuer: auth-service
  admin:
    email: admin@local.test
    password: Admin@1234!
    first-name: System
    last-name: Administrator

springdoc:
  servers:
    - url: /api/auth
